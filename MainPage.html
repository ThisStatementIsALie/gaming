<!DOCTYPE html>
<html>
    <head>
        <script src="sweeper.js"></script>
        <link rel="stylesheet" href="MainPage.css">
        <title>Main Page</title>
        <body> 
            The purpose of this website is to publish a multitude of dumb little games.<br><br>
            Originally, these games had to be launched using the terminal, then the board is a png which updates.<br><br>
            The games work the exact same way... but now the input and output makes sense. <br><br>
            Enjoy!<br><br>
        </body>
        <div class="snakeText">
            <p id="snakeText">> SNAKE</p>
        </div>
        <br>
        <div class="mineText">
            <p id="mineText">> MINESWEEPER</p>
        </div>
        <br>
        <canvas id="canvas" width="99" height="99" style="border:1px solid #000"></canvas>
        <br>
        <button onclick="prepareThineSweeper()"> PLAY </button>
    </head>

    <script>
        var currentGame = "None";

        function activateBoard() {
            if (currentGame == "minesweeper") {
                prepareThineSweeper();
            } else if (currentGame == "snake"){
                snakeBoard();
            }
        }
        
        document.getElementById("mineText").addEventListener("click", function() {
            currentGame = "minesweeper";
            activateBoard();
        });

        document.getElementById("snakeText").addEventListener("click", function() {
            currentGame = "snake";
            activateBoard();
        });

        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        var boardData = ctx.createImageData(100, 100);

        var data;
        var intBoard;
        var boolBoard;
        var size = 99;

        function prepareThineSweeper() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=400) {
                for (let x = 0; x < data.length; x+=4) {
                    if ((x+4)%40 == 0 || (y+400)%4000 == 0) {
                        data[y+x+0] = 0;
                        data[y+x+1] = 0;
                        data[y+x+2] = 0;
                    } else {
                        data[y+x+0] = 255;
                        data[y+x+1] = 242;
                        data[y+x+2] = 204;
                    }
                    data[y+x+3] = 255;
                }
            }
            ctx.putImageData(boardData,0,0);
        }

        function snakeBoard() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=400) {
                for (let x = 0; x < data.length; x+=4) {
                    if ((x+4)%40 == 0 || (y+400)%4000 == 0) {
                        data[y+x+0] = 0;
                        data[y+x+1] = 0;
                        data[y+x+2] = 0;
                    } else {
                        data[y+x+0] = 20;
                        data[y+x+1] = 255;
                        data[y+x+2] = 20;
                    }
                    data[y+x+3] = 255;
                }
            }
            ctx.putImageData(boardData,0,0);
        }
    </script>
</html>

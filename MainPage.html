        function testBoard() {
            data = boardData.data;
            for (let y = 0; y < 101; y++) {
                for (let x = 0; x < 101; x++) {
                    for (let y2 = 0; y2 < scale; y2++) {
                        for (let x2 = 0; x2 < scale; x2++) {
                            data[4*404*y2+(404*scale*y)+4*x2+(4*scale*x)+0] = 255;
                            data[4*404*y2+(404*scale*y)+4*x2+(4*scale*x)+1] = 0;
                            data[4*404*y2+(404*scale*y)+4*x2+(4*scale*x)+2] = 0;
                            data[4*404*y2+(404*scale*y)+4*x2+(4*scale*x)+3] = 255;
                            console.log(4*404*y2+(404*scale*y)+4*x2+(4*scale*x));
                        }
                    }

        function snakeBoard() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=1600) {
                for (let x = 0; x < data.length; x+=4) {
                    if ((x+4)%160 == 0 || (y+1600)%64000 == 0) {
                        data[y+x+0] = 0;
                        data[y+x+1] = 0;
                        data[y+x+2] = 0;
                    } else {
                        data[y+x+0] = 20;
                        data[y+x+1] = 255;
                        data[y+x+2] = 20;
                    }
                    data[y+x+3] = 255;
                }
            }
            ctx.putImageData(boardData,0,0);

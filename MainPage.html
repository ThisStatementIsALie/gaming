<!DOCTYPE html>
<html>
    <head>
        <script src="sweeper.js"></script>
        <link rel="stylesheet" href="MainPage.css">
        <title>Main Page</title>
        <body> 
            The purpose of this website is to publish a multitude of dumb little games.<br><br>
            Originally, these games had to be launched using the terminal, then the board is a png which updates.<br><br>
            The games work the exact same way... but now the input and output makes sense. <br><br>
            Enjoy!<br><br>
        </body>
        <div class="snakeText">
            <p>> SNAKE</p>
        </div>
        <br>
        <div class="mineText">
            <p>> MINESWEEPER</p>
        </div>
        <br>
        <canvas id="canvas" width="100" height="100" style="border:1px solid #000"></canvas>
        <br>
        <button onclick="prepareThineSweeper()"> PLAY </button>
    </head>

    <script>
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        var boardData = ctx.createImageData(100, 100);

        var data;
        var intBoard;
        var boolBoard;
        var size = Math.sqrt(data.length/4);

        function prepareThineSweeper() {
            data = boardData.data;
            for (let y = 0; y < size; y+=4) {
                for (let x = 0; x < size; x+=4) {
                    if (y%10 == 0) {
                        data[y*size+x+0] = 0;
                        data[y*size+x+1] = 0;
                        data[y*size+x+2] = 0;
                    } else {
                        data[y*size+x+0] = 255;
                        data[y*size+x+1] = 242;
                        data[y*size+x+2] = 204;
                    }
                    data[y*size+x+3] = 255;
                }
            }
            ctx.putImageData(boardData,0,0);
        }
    </script>
</html>

            gameStarted = true;

            } else if (currentGame == "snake") {

            }

            if (!gameStarted) {

                document.getElementById("desc").innerHTML=
            "MINESWEEPER<br>The goal of the game is to dig all of the tiles on the board without selecting a mine.<br>Numbers on each tile tell you how many of the 8 directly adjacent spaces are mines.<br>---------<br>KEYBINDS:<br>z - Dig<br>x - Place/Remove flag<br>r - Reset board<br>---------<br>Hover your mouse over a tile and dig to start.<br>If you fail, dig anywhere on the board to reset.";

                if (event.key == "r") {
                    blankSweep();

                }

                    if (event.key == "z") {
                        if (gameOvered) {
                            gameOvered = false;
                            blankSweep();
                        } else if (!gameStarted) {
                            beginGame();
                        } else {
                            if (!flagboard[mouseY2][mouseX2]) {
                                if (intboard[mouseY2][mouseX2] == 9) {
                                    hitMine();
                                } else {
                                    if (!boolboard[mouseY2][mouseX2]) {
                                        boolboard[mouseY2][mouseX2] = true;
                                        tilesLeft--;
                                        updateShown();
                                        updateBoard();
                                        updateInfo();
                                    }
                                    
                                }
                            }                        
                        }

                        if (flagboard[mouseY2][mouseX2]) {
                            flagboard[mouseY2][mouseX2] = false;
                            flagsPlaced--;
                            updateInfo();
                        } else if (!boolboard[mouseY2][mouseX2]) {
                            flagboard[mouseY2][mouseX2] = true;

                            updateInfo();
                        }

                    }
                }

        function updateBoard() {
            data = boardData.data;

            var randx;
            var randy;
            var artX;
            var artY;

            for (let y = 0; y < data.length; y+=6464) {
                for (let x = 0; x < 1616; x+=16) {
                    for (let y2 = 0; y2 < 6464; y2+=1616) {
                        for (let x2 = 0; x2 < 16; x2+=4) {
                            trueX = Math.floor(x/160);
                            trueY = Math.floor(y/64640);
                            artX = (x%160)/16-2;
                            artY = (y%640)/64-2;
                            if (x%160 == 0 || y%640 == 0) {
                                data[y+x+y2+x2+0] = 0;
                                data[y+x+y2+x2+1] = 0;
                                data[y+x+y2+x2+2] = 0;
                            } else if (artX == -1 || artX == 7 || artY == -1 || artY == 7) {
                                data[y+x+y2+x2+0] = 255;
                                data[y+x+y2+x2+1] = 242;
                                data[y+x+y2+x2+2] = 204;
                            } else if (intboard[trueY][trueX] == 0 && boolboard[trueY][trueX]) {
                                data[y+x+y2+x2+0] = msCols[0][0];
                                data[y+x+y2+x2+1] = msCols[0][1];
                                data[y+x+y2+x2+2] = msCols[0][2];
                            } else if (intboard[trueY][trueX] == 1 && boolboard[trueY][trueX]) {
                                data[y+x+y2+x2+0] = mineArt[0][artY][artX][0];
                                data[y+x+y2+x2+1] = mineArt[0][artY][artX][1];
                                data[y+x+y2+x2+2] = mineArt[0][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 2 && boolboard[trueY][trueX]) {
                                data[y+x+y2+x2+0] = mineArt[1][artY][artX][0];
                                data[y+x+y2+x2+1] = mineArt[1][artY][artX][1];
                                data[y+x+y2+x2+2] = mineArt[1][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 3 && boolboard[trueY][trueX]) {

                            } else if (intboard[trueY][trueX] == 4 && boolboard[trueY][trueX]) {

                                data[y+x+y2+x2+2] = mineArt[3][artY][artX][2];

        function updateShown() {
            var amountrevealed = 0;
            var totalrevealed = 1;
            while (totalrevealed != 0) {
                amountrevealed = 0;
                for (let y = 0; y < 10; y++) {
                    for (let x = 0; x < 10; x++) {
                        if (boolboard[y][x] && intboard[y][x] == 0) {
                            for (let y2 = y-1; y2 < y+2; y2++) {
                                for (let x2 = x-1; x2 < x+2; x2++) {
                                    if (y2 > -1 && y2 < 10 && x2 > -1 && x2 < 10 && (y2 != y || x2 != x) && !boolboard[y2][x2]) {
                                        boolboard[y2][x2] = true;
                                        amountrevealed++;
                                        tilesLeft--;
                                        updateInfo();
                                    }
                                }
                            }
                        }
                    }
                }
                totalrevealed = amountrevealed;
            }
        }

        function prepareThineMines() {
            flagsPlaced = 0;
            tilesLeft = 84;
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    intboard[y][x] = 0;
                    boolboard[y][x] = false;
                    flagboard[y][x] = false;
                }
            }

            boolboard[mouseY2][mouseX2] = true;

            for (let minesleft = 15; minesleft > 0; minesleft+=0) {
                randx = Math.floor(Math.random()*10);
                randy = Math.floor(Math.random()*10);
                if ((Math.abs(randx-mouseX2) >= 2 || Math.abs(randy-mouseY2) >= 2) && intboard[randy][randx] != 9) {
                    intboard[randy][randx] = 9;
                    minesleft--;
                }
            }

            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    if (intboard[y][x] != 9) {
                        for (let y2 = y-1; y2 < y+2; y2++) {
                            for (let x2 = x-1; x2 < x+2; x2++) {
                                if (y2 > -1 && y2 < 10 && x2 > -1 && x2 < 10 && (y2 != y || x2 != x)) {
                                    if (intboard[y2][x2] == 9) {
                                        intboard[y][x]++;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function blankSweep() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=6464) {

                            trueY = Math.floor(y/64640);

                                data[y+x+y2+x2+1] = 0;

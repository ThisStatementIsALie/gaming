        function testBoard() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=6464) {
                for (let x = 0; x < 1616; x+=16) {
                    for (let y2 = 0; y2 < 6464; y2+=1616) {
                        for (let x2 = 0; x2 < 16; x2+=4) {
                            if (x%160 == 0 || y%640 == 0) {
                                data[y+x+y2+x2+0] = 0;
                                data[y+x+y2+x2+1] = 0;
                                data[y+x+y2+x2+2] = 0;
                            } else if (x%160 == 16 || x%160 == 144 || y%640 == 64 || y%640 == 576) {
                                data[y+x+y2+x2+0] = 255;
                                data[y+x+y2+x2+1] = 242;
                                data[y+x+y2+x2+2] = 204;
                            } else {
                                data[y+x+y2+x2+0] = 215;
                                data[y+x+y2+x2+1] = 202;
                                data[y+x+y2+x2+2] = 164;
                            }
                            data[y+x+y2+x2+3] = 255;
                        }
                    }
                }
            }
            ctx.putImageData(boardData,0,0);
        }

        function snakeBoard() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=1616) {
                for (let x = 0; x < data.length; x+=4) {
                    if ((x+4)%160 <= 2 || (x+4)%160 >= 156 || (y+1616)%640 == 0) {
                        data[y+x+0] = 0;
                        data[y+x+1] = 0;
                        data[y+x+2] = 0;
                    } else {
                        data[y+x+0] = 20;
                        data[y+x+1] = 255;
                        data[y+x+2] = 20;
                    }
                    data[y+x+3] = 255;
                }
            }
            ctx.putImageData(boardData,0,0);
        }

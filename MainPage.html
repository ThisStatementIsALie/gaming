<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="MainPage.css">
        <title>Main Page</title>
        <body> 
            The purpose of this website is to publish a multitude of dumb little games.<br><br>
            Originally, these games had to be launched using the terminal, then the board is a png which updates.<br><br>
            The games work the exact same way... but now the input and output makes sense. <br><br>
            Enjoy!<br><br>
        </body>
        <div class="snakeText">
            <p onclick="setImgSnake()" \>> SNAKE</p>
        </div>
        <br>
        <div class="mineText">
            <p onclick="setImgMine()" \>> MINESWEEPER</p>
        </div>
        <br>
        <img id="game" src="missingGame.png" width="400px">
        <br>
            <button onclick="start()"> PLAY </button>
    </head>
</html>

<script>
    var game = 0; // 0  is none, 1 is Mine, 2 is Snake

    function setImgSnake() {
        document.getElementById("game").src="snake/snakeBoard.png";
        game = 1;
    }

    function setImgMine() {
        document.getElementById("game").src="minesweeper/mineBoard.png";
        game = 2;
    }
</script>

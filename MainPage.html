        function prepareThineSweeper() {
            data = boardData.data;

            var randx;
            var randy;
            var artX;
            var artY;

            for (let y = 0; y < data.length; y+=6464) {
                for (let x = 0; x < 1616; x+=16) {
                    for (let y2 = 0; y2 < 6464; y2+=1616) {
                        for (let x2 = 0; x2 < 16; x2+=4) {
                            trueX = Math.floor(x/160);
                            trueY = Math.floor(y/64640);
                            artX = (x%160)/16-2;
                            artY = (y%640)/64-2;
                            if (x%160 == 0 || y%640 == 0) {
                                data[y+x+y2+x2+0] = 0;
                                data[y+x+y2+x2+1] = 0;
                                data[y+x+y2+x2+2] = 0;
                            } else if (artX == -1 || artX == 7 || artY == -1 || artY == 7) {
                                data[y+x+y2+x2+0] = 255;
                                data[y+x+y2+x2+1] = 242;
                                data[y+x+y2+x2+2] = 204;
                            } else if (intboard[trueY][trueX] == 0) {
                                data[y+x+y2+x2+0] = colors[0][0];
                                data[y+x+y2+x2+1] = colors[0][1];
                                data[y+x+y2+x2+2] = colors[0][2];
                            } else if (intboard[trueY][trueX] == 1) {
                                data[y+x+y2+x2+0] = pixArt[0][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[0][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[0][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 2) {
                                data[y+x+y2+x2+0] = pixArt[1][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[1][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[1][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 3) {
                                data[y+x+y2+x2+0] = pixArt[2][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[2][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[2][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 4) {
                                data[y+x+y2+x2+0] = pixArt[3][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[3][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[3][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 5) {
                                data[y+x+y2+x2+0] = pixArt[4][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[4][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[4][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 6) {
                                data[y+x+y2+x2+0] = pixArt[5][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[5][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[5][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 7) {
                                data[y+x+y2+x2+0] = pixArt[6][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[6][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[6][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 8) {
                                data[y+x+y2+x2+0] = pixArt[7][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[7][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[7][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 9) {
                                data[y+x+y2+x2+0] = pixArt[8][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[8][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[8][artY][artX][2];
                            } else if (intboard[trueY][trueX] == 10) {
                                data[y+x+y2+x2+0] = pixArt[9][artY][artX][0];
                                data[y+x+y2+x2+1] = pixArt[9][artY][artX][1];
                                data[y+x+y2+x2+2] = pixArt[9][artY][artX][2];
                            }
                            data[y+x+y2+x2+3] = 255;
                        }
                    }
                }
            }
            ctx.putImageData(boardData,0,0);
        }

        function prepareThineMines() {
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    intboard[y][x] = 0;
                }
            }
            for (let minesleft = 25; minesleft > 0; minesleft+=0) {
                randx = Math.floor(Math.random()*10);
                randy = Math.floor(Math.random()*10);
                if ((Math.abs(randx-mouseX2) >= 2 || Math.abs(randy-mouseY2) >= 2) && intboard[randy][randx] != 9) {
                    intboard[randy][randx] = 9;
                    minesleft--;
                }
            }

            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    if (intboard[y][x] != 9) {
                        for (let y2 = y-1; y2 < y+2; y2++) {
                            for (let x2 = x-1; x2 < x+2; x2++) {
                                if (y2 > -1 && y2 < 10 && x2 > -1 && x2 < 10 && (y2 != y || x2 != x)) {
                                    if (intboard[y2][x2] == 9) {
                                        intboard[y][x]++;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function blankSweep() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=6464) {
                for (let x = 0; x < 1616; x+=16) {
                    for (let y2 = 0; y2 < 6464; y2+=1616) {
                        for (let x2 = 0; x2 < 16; x2+=4) {
                            trueX = Math.floor(x/160);
                            trueY = Math.floor(y/64640);
                            if (x%160 == 0 || y%640 == 0) {
                                data[y+x+y2+x2+0] = 0;
                                data[y+x+y2+x2+1] = 0;
                                data[y+x+y2+x2+2] = 0;
                            } else if (x%160 == 16 || x%160 == 144 || y%640 == 64 || y%640 == 576) {
                                data[y+x+y2+x2+0] = 255;
                                data[y+x+y2+x2+1] = 242;
                                data[y+x+y2+x2+2] = 204;
                            } else {
                                data[y+x+y2+x2+0] = colors[0][0];
                                data[y+x+y2+x2+1] = colors[0][1];
                                data[y+x+y2+x2+2] = colors[0][2];
                            }
                            data[y+x+y2+x2+3] = 255;
                        }
                    }
                }
            }
            ctx.putImageData(boardData,0,0);
        }

        function snakeBoard() {
            data = boardData.data;
            for (let y = 0; y < data.length; y+=6464) {
                for (let x = 0; x < 1616; x+=16) {
                    for (let y2 = 0; y2 < 6464; y2+=1616) {
                        for (let x2 = 0; x2 < 16; x2+=4) {
                            if (x%160 == 0 || y%640 == 0) {
                                data[y+x+y2+x2+0] = 0;
                                data[y+x+y2+x2+1] = 0;
                                data[y+x+y2+x2+2] = 0;
                            } else {
                                data[y+x+y2+x2+0] = 20;
                                data[y+x+y2+x2+1] = 255;
                                data[y+x+y2+x2+2] = 20;
                            }
                            data[y+x+y2+x2+3] = 255;
                        }
                    }
                }
            }
            ctx.putImageData(boardData,0,0);
